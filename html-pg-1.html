<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>PG Finder - Book Your Stay</title>
  <link rel="icon" href="image.png">
  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="html-pg-1.css">
</head>

<body oncopy="return false;" oncut="return false;" onpaste="return false;">

  <!-- Header / Navigation -->
  <header class="main-header">
    <div class="logo-container">
      <img src="image.png" alt="PG Finder Logo" class="logo-img">
      <span class="logo-text">PG Finder</span>
    </div>
    <nav class="nav-links">
      <ul>
        <li><a href="#">HOME</a></li>
        <li><a href="#">ABOUT</a></li>
        <li><a href="#">CONTACT</a></li>
        <li><a href="#">HELP</a></li>
      </ul>
    </nav>
  </header>

  <main class="main-content">
    <div class="hero-section">
      <h1>Find Your Perfect PG</h1>
      <p class="subtitle">Search and book comfortable stays in your city</p>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search by PG Name or City..." onkeyup="searchHotels()">
      </div>
    </div>

    <div id="hotelList" class="pg-grid">
      <!-- PG Cards will be injected here -->
    </div>
  </main>

  <!-- Modals -->
  <div id="bookingDetails" class="modal-card" style="display: none;">
    <div class="modal-header">
      <h3>Booking Confirmed</h3>
      <button id="booking-close-btn" class="close-icon">&times;</button>
    </div>
    <div class="modal-body" id="bookedHotelInfo"></div>
  </div>

  <p id="outlook"></p>

  <div id="asking" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Enter Details</h3>
        <button id="asking-close-btn" class="close-icon">&times;</button>
      </div>
      <div class="modal-body" id="asking-details">
        <div class="input-group">
          <label>Full Name</label>
          <input id="user-name" type="text" placeholder="e.g. John Doe">
        </div>
        <div class="input-group">
          <label>Contact Number</label>
          <input id="user-contact" type="number" placeholder="e.g. 9876543210">
        </div>

        <div class="otp-section">
          <button id="otp-btn" type="button" class="btn-primary">Send OTP</button>
          <input id="otp-recive" placeholder="Enter OTP">
        </div>

        <button id="submit-btn" type="button" class="btn-success full-width">Confirm Booking</button>
      </div>
    </div>
  </div>

  <div class="map-container">
    <iframe
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d124738.44878734997!2d76.55328769040317!3d12.31063340666031!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3baf70381d572ef9%3A0x2b89ece8c0f8396d!2sMysuru%2C%20Karnataka!5e0!3m2!1sen!2sin!4v1753631566286!5m2!1sen!2sin"
      width="100%" height="400" style="border:0;" allowfullscreen="" loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"></iframe>
  </div>

  <script src="html-pg-1.js"></script>

</body>

</html>
